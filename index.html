<style>

body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}

.grid.sl-l{animation:slL .22s ease-out}.grid.sl-r{animation:slR .22s ease-out}

.dt p{font-size:14px;line-height:1.6;margin:8px 0}

</style>

<script>

var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var vnd = function (n) { return n ? n.toLocaleString('vi-VN') + ' đ' : ''; };

cart = LS.get('qr_cart') || {};
google.script.run.withSuccessHandler(function (j) {
  P = JSON.parse(j); P.forEach(function (p) { p.k = nrm(p.s + ' ' + p.m + ' ' + p.t + ' ' + p.b); byS[p.s] = p; });

  var cats = []; P.forEach(function (p) { if (p.n && cats.indexOf(p.n) < 0) cats.push(p.n); });
  $('chips').innerHTML = '<button class="chip on" data-c="">Tất cả (' + P.length + ')</button>' + cats.map(function (c) {
    return '<button class="chip" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join('');
  if (NHOM0 && cats.indexOf(NHOM0) >= 0) setCat(NHOM0);
  else if (SP0 && byS[SP0] && byS[SP0].n) setCat(byS[SP0].n);
  if (SP0 && byS[SP0]) { var ix = list().indexOf(byS[SP0]); if (ix >= 0) page = Math.floor(ix / PER) + 1; }
  render(); upd();
  if (SP0 && byS[SP0]) setTimeout(function () { var el = document.querySelector('.card[data-s="' + CSS.escape(SP0) + '"]'); if (el) el.scrollIntoView({ block: 'center' }); }, 100);
}).withFailureHandler(function (e) { $('msg').textContent = 'Không tải được sản phẩm: ' + e.message; }).getProducts();

$('chips').onclick = function (e) { var b = e.target.closest('.chip'); if (b) setCat(b.dataset.c); };
function setCat(c) { cat = c; page = 1; [].forEach.call(document.querySelectorAll('.chip'), function (b) { b.classList.toggle('on', b.dataset.c === c); if (b.dataset.c === c) b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); }); render(); }
/* Vuốt trái / phải để chuyển nhóm hàng */
(function () {

      '<p class="note">' + r.soMau + ' mẫu · ' + r.tongSL + ' sản phẩm' + (r.tong ? ' · tạm tính ' + vnd(r.tong) : '') + '<br>Bên bán sẽ liên hệ số ' + esc(o.sdt) + ' để xác nhận đơn và báo giá vận chuyển.</p>' +
      '<div style="display:flex;gap:10px;margin-top:14px"><a class="btn sec" style="flex:1;text-decoration:none" href="https://zalo.me/' + ZALO + '">Nhắn Zalo</a><button class="btn" style="flex:1" onclick="closeSheet()">Đặt tiếp</button></div></div>');
  }).withFailureHandler(function (e) { $('f_go').disabled = false; $('f_go').textContent = 'Gửi đơn hàng'; $('f_err').textContent = e.message || 'Gửi đơn lỗi, vui lòng thử lại.'; }).placeOrder(o);
}

/* ---- Hướng dẫn cài app ---- */
(function () {
  var b = $('inst');
  if (STANDALONE) { b.style.display = 'none'; return; }
  var hasPub = false;
  b.onclick = function () {
    if (DEFER) { DEFER.prompt(); DEFER.userChoice.then(function (r) { if (r.outcome === 'accepted') b.style.display = 'none'; DEFER = null; }); return; }
    var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua);
    var link = hasPub ? '<a class="lk" href="' + esc(PUB) + '" target="_blank">' + esc(PUB) + '</a>' : '';
    var buoc0 = hasPub ? '<li>Mở link dưới đây (bản có logo để cài):' + link + '</li>' : '';
    var and = '<h4>Điện thoại Android (Chrome)</h4><ol>' + buoc0 + '<li>Bấm nút <b>Cài app</b> màu vàng trên trang, hoặc bấm <b>⋮</b> góc phải trên</li><li>Chọn <b>Cài đặt ứng dụng</b> / <b>Thêm vào màn hình chính</b></li><li>Bấm <b>Cài đặt</b> – biểu tượng app hiện trên màn hình chính</li></ol>';
    var iph = '<h4>iPhone / iPad (Safari)</h4><ol>' + buoc0 + '<li>Mở bằng <b>Safari</b> (nếu đang ở Zalo/Facebook: bấm ⋯ → Mở bằng trình duyệt)</li><li>Bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên) ở thanh dưới</li><li>Chọn <b>Thêm vào MH chính</b> → <b>Thêm</b></li></ol>';
    openSheet('<div class="gd"><h2>Cài app đặt hàng <button class="x" onclick="closeSheet()">×</button></h2>' +
      '<p class="note" style="margin:0">Cài một lần, lần sau chỉ cần chạm biểu tượng trên màn hình chính là vào đặt hàng – không cần quét QR, thông tin nhận hàng được giữ lại.</p>' +
      (ios ? iph + and : and + iph) +
      '<p class="note">Nếu không thấy mục cài đặt, hãy mở trang bằng trình duyệt Chrome (Android) hoặc Safari (iPhone) thay vì mở trong Zalo/Facebook.</p></div>');
  };
})();

/* ---- định vị địa chỉ nhận hàng ---- */
var GEO = null, LMAP = null;
function geoSt(h) { var e = $('g_st'); if (e) e.innerHTML = h; }
function revGeo(lat, lng) {
  return fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=vi&lat=' + lat + '&lon=' + lng)
    .then(function (r) { return r.json(); }).then(function (j) {
      var a = j.address || {}, tinh = a.state || a.city || a.province || '';
      var parts = [a.house_number, a.road || a.pedestrian || a.footway, a.hamlet || a.village || a.neighbourhood || a.quarter, a.suburb || a.town || a.city_district, a.county, a.city && a.city !== tinh ? a.city : ''];
      var dc = parts.filter(function (x, i, arr) { return x && arr.indexOf(x) === i; }).join(', ');
      return { dc: dc || (j.display_name || '').replace(/, Việt Nam$/, ''), tinh: tinh.replace(/^(Tỉnh|Thành phố) /, '') };
    });
}
function geoApply(lat, lng) {
  lat = (+lat).toFixed(6); lng = (+lng).toFixed(6); GEO = { lat: lat, lng: lng };
  var link = 'https://maps.google.com/?q=' + lat + ',' + lng;
  geoSt('<div class="gpsok">Đang tìm địa chỉ…</div>');
  return revGeo(lat, lng).then(function (r) {
    if (r.dc && $('f_dc')) $('f_dc').value = r.dc;
    if (r.tinh && $('f_tinh')) $('f_tinh').value = r.tinh;
    geoSt('<div class="gpsok">✓ Đã lấy vị trí · <a href="' + link + '" target="_blank" rel="noopener">xem bản đồ</a>. Vui lòng bổ sung số nhà / tên đường nếu còn thiếu.</div>');
  }).catch(function () {
    geoSt('<div class="gpsok">✓ Đã ghi toạ độ (<a href="' + link + '" target="_blank" rel="noopener">xem bản đồ</a>) nhưng chưa tra được tên đường – vui lòng gõ thêm địa chỉ.</div>');
  });
}
function gpsGet() {
  return new Promise(function (ok, no) {
    if (!navigator.geolocation) return no({ code: 9 });
    navigator.geolocation.getCurrentPosition(function (p) { ok(p.coords); }, no, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  });
}
function gpsErr(e) {
  var m = e && e.code === 1 ? 'Bạn chưa cho phép truy cập vị trí. Vào cài đặt trình duyệt → Quyền vị trí → Cho phép, rồi bấm lại.' :
    e && e.code === 9 ? 'Máy này không hỗ trợ định vị.' : 'Chưa lấy được vị trí (bật GPS / Vị trí trên điện thoại rồi thử lại).';
  geoSt('<div class="err" style="margin-top:4px">' + m + '</div>');
}
function gpsNow() {
  var b = $('g_now'); b.disabled = true; geoSt('<div class="gpsok">Đang xác định vị trí…</div>');
  gpsGet().then(function (c) { return geoApply(c.latitude, c.longitude); }, gpsErr).then(function () { b.disabled = false; });
}
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise(function (ok, no) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(l);
    var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s);
  });
}
var MTO = null;
function mapAddr() {
  var c = LMAP.getCenter(); $('m_ad').textContent = 'Đang tìm địa chỉ…'; clearTimeout(MTO);
  MTO = setTimeout(function () { revGeo(c.lat, c.lng).then(function (r) { $('m_ad').textContent = (r.dc || '') + (r.tinh ? ', ' + r.tinh : ''); }, function () { $('m_ad').textContent = 'Vị trí: ' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5); }); }, 700);
}
function mapOpen() {
  var ov = $('mapov');
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'mapov'; ov.className = 'mapov';
    ov.innerHTML = '<div class="mh"><span>Kéo bản đồ để ghim đúng chỗ nhận hàng</span><button class="x" onclick="mapClose()">×</button></div>' +
      '<div id="gmap"><svg class="pin" viewBox="0 0 24 24"><path fill="#ff6a4d" stroke="#fff" stroke-width="1.5" d="M12 1.5a7.5 7.5 0 0 0-7.5 7.5c0 5.6 7.5 13.5 7.5 13.5s7.5-7.9 7.5-13.5A7.5 7.5 0 0 0 12 1.5z"/><circle cx="12" cy="9" r="2.8" fill="#fff"/></svg></div>' +
      '<div class="mf"><div class="ma2" id="m_ad">Đang tải bản đồ…</div><div style="display:flex;gap:8px"><button class="btn sec" style="flex:1" onclick="mapMe()">📍 Vị trí của tôi</button><button class="btn" style="flex:2" onclick="mapPick()">Chọn vị trí này</button></div></div>';
    document.body.appendChild(ov);
  }
  ov.classList.add('on');
  loadLeaflet().then(function () {
    if (!LMAP) {
      var c0 = GEO ? [+GEO.lat, +GEO.lng] : [20.86, 106.68];
      LMAP = L.map('gmap', { zoomControl: true, attributionControl: true }).setView(c0, GEO ? 17 : 12);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(LMAP);
      LMAP.on('moveend', mapAddr);
      if (!GEO) mapMe(); else mapAddr();
    } else { setTimeout(function () { LMAP.invalidateSize(); }, 50); mapAddr(); }
  }, function () { $('m_ad').textContent = 'Không tải được bản đồ, vui lòng kiểm tra mạng.'; });
}
function mapMe() { gpsGet().then(function (c) { LMAP.setView([c.latitude, c.longitude], 17); }, function (e) { $('m_ad').textContent = e && e.code === 1 ? 'Chưa cho phép truy cập vị trí – kéo bản đồ để chọn thủ công.' : 'Chưa lấy được vị trí – kéo bản đồ để chọn thủ công.'; }); }
function mapClose() { var ov = $('mapov'); if (ov) ov.classList.remove('on'); }
function mapPick() { var c = LMAP.getCenter(); mapClose(); geoApply(c.lat, c.lng); }
</script>
